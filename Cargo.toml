[package]
name = "layoutkeeper"
version = "2.0.0"
edition = "2021"
authors = ["MR-PR0G <https://github.com/MR-PR0G>"]
description = "Enterprise-grade universal per-window keyboard layout manager and smart terminal switcher for Linux (Wayland & X11)"
license = "MIT"
repository = "https://github.com/MR-PR0G/LayoutKeeper"
readme = "README.md"
keywords = ["keyboard", "layout", "wayland", "x11", "window-manager"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
